   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #1f4e79" transform="translate(114.863687 77.421344)">4 pcap files</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #1f4e79" transform="translate(119.744937 85.798594)">36.2 GB</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #1f4e79" transform="translate(108.749937 94.175844)">68.7 M packets</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #0e7c7b" transform="translate(196.494938 77.421344)">Field extraction</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #0e7c7b" transform="translate(209.602438 85.798594)">(tshark,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #0e7c7b" transform="translate(203.832438 94.175844)">per packet)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #375623" transform="translate(283.793063 73.225219)">Data convention</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #375623" transform="translate(285.791188 81.602469)">one-way bytes;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #375623" transform="translate(276.791813 89.994719)">loopback and non-IP</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #375623" transform="translate(297.116188 98.371969)">split out</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #7030a0" transform="translate(378.867437 73.232719)">Three views</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #7030a0" transform="translate(378.301187 81.609969)">49,560 hosts</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #7030a0" transform="translate(376.411812 89.987219)">693k sessions</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #7030a0" transform="translate(376.306812 98.364469)">13,957 names</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #c55a11" transform="translate(462.160563 73.217719)">Four detections</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #c55a11" transform="translate(454.907438 81.594969)">periodicity, entropy,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #c55a11" transform="translate(463.828063 89.987219)">change points,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #c55a11" transform="translate(472.496188 98.379469)">extremes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #a61c00" transform="translate(543.124938 77.406344)">Findings and advice</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #a61c00" transform="translate(541.500563 85.798594)">capacity, monitoring,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman', serif; fill: #a61c00" transform="translate(550.344313 94.190844)">limitation notes</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14.3px; font-family: 'Times New Roman', serif; text-anchor: start" x="90.144" y="16.892719" transform="rotate(-0 90.144 16.892719)">Analysis pipeline: from raw captures to defensible statements</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 164.384)">Every arrow is a script kept in the project folder, re-runnable end to end. Source: cap_20260920_111416/112321/112821/113321.pcap (4 files, 17.2 min;</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 175.923344)">two continuous blocks of 192 s and 842 s). One-way byte convention; loopback and non-IP traffic are handled per the data-convention note. Time-based</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 187.462688)">statements are limited to those two blocks.</text>
  </g>
 </g>
