  <g id="text_21">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Times New Roman', serif; text-anchor: start" x="7.2" y="17.367188" transform="rotate(-0 7.2 17.367188)">Direction of traffic: inbound dominates the bytes, packets stay symmetric</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 287.570125)">Byte shares, denominator = sum of the five direction classes (34.26 GB): Inbound 63.1% (21.6 GB) · Outbound 17.4% (5.9 GB) · Inside ↔ inside 12.5%</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 299.109469)">(4.3 GB) · Loopback 5.3% (1.8 GB) · Host → own services 1.7% (0.6 GB). In/out byte ratio 3.64x while the packet ratio is 0.93x. Source:</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 310.648812)">cap_20260920_111416/112321/112821/113321.pcap (4 files, 17.2 min; two continuous blocks of 192 s and 842 s). One-way byte convention; loopback and</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 322.188156)">non-IP traffic are handled per the data-convention note. Time-based statements are limited to those two blocks.</text>
  </g>
