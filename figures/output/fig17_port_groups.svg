   <g id="text_25">
    <text style="font-weight: 700; font-size: 14.3px; font-family: 'Times New Roman', serif; text-anchor: start" x="67.68" y="16.892719" transform="rotate(-0 67.68 16.892719)">Three source ports carry near-identical volume</text>
   </g>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 269.332298)">The three highlighted ports differ by a handful of packets out of about 810,000 each. Ports 50316 and 35326 are dominated by a single inside host</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 280.871642)">(10.100.100.40), and port 45780 is almost entirely loopback (127.0.0.1); that reads as one application spread over parallel channels, not as</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 292.410986)">adversarial behaviour. Source: cap_20260920_111416/112321/112821/113321.pcap (4 files, 17.2 min; two continuous blocks of 192 s and 842 s). One-way</text>
   <text style="font-size: 11px; font-family: 'Times New Roman', serif; fill: #6b6b6b" transform="translate(7.2 303.95033)">byte convention; loopback and non-IP traffic are handled per the data-convention note. Time-based statements are limited to those two blocks.</text>
  </g>
 </g>
